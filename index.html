und:#EFF6FF;color:#2563EB;border-color:#BFDBFE}@media(max-width:760px){.profile-menu{right:-4px;top:50px;width:235px}.settings-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-shortcut:last-child{grid-column:1/-1}.report-tabs{overflow-x:auto}}
    /* Report > Upload Invoice uses the full content area; legacy report heading/tabs are intentionally hidden. */

    #upload-invoice-report .report-search-btn,#upload-invoice-report .report-reset-btn{height:40px;border:0;border-radius:12px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:10px;font-weight:950;cursor:pointer;white-space:nowrap;transition:.22s;position:relative;overflow:hidden}

    #upload-invoice-report .report-table-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #E2E8F0;background:linear-gradient(90deg,#F8FAFC,#fff)}

    #upload-invoice-report .amount-cell{font-size:10px;font-weight:950;color:#0F172A}
    #upload-invoice-report .action-group{display:flex;align-items:center;gap:7px}
    #upload-invoice-report .report-action{width:32px;height:32px;border:1px solid transparent;border-radius:11px;display:grid;place-items:center;font-size:13px;cursor:pointer;transition:.22s;box-shadow:5px 6px 10px rgba(15,23,42,.09),inset 1px 1px 2px rgba(255,255,255,.7);position:relative}
    #upload-invoice-report .report-action:hover{transform:translateY(-4px) rotate(-2deg);box-shadow:7px 10px 15px rgba(15,23,42,.14)}
    #upload-invoice-report .report-action:active{transform:translateY(1px) scale(.94)}
    #upload-invoice-report .action-view{background:linear-gradient(145deg,#60A5FA,#2563EB);color:#fff}.action-download{background:linear-gradient(145deg,#2DD4BF,#0D9488);color:#fff}.action-edit{background:linear-gradient(145deg,#FBBF24,#F59E0B);color:#fff}.action-delete{background:linear-gradient(145deg,#FB7185,#EF4444);color:#fff}
    #upload-invoice-report .report-empty{padding:35px;text-align:center;color:#94A3B8;font-size:11px;font-weight:800}
    #reportDeleteModal{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:500}
    #reportDeleteModal.open{display:flex}
    #reportDeleteModal .delete-dialog{width:min(390px,calc(100% - 30px));padding:20px;border-radius:22px;background:linear-gradient(145deg,#fff,#F8FAFC);border:1px solid #E2E8F0;box-shadow:18px 22px 45px rgba(15,23,42,.28),inset 1px 1px 2px #fff;animation:deleteModalIn .22s ease both}
    #reportDeleteModal .delete-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#FB7185,#EF4444);color:#fff;font-size:21px;box-shadow:7px 8px 14px rgba(239,68,68,.22),inset 2px 2px 3px rgba(255,255,255,.35);margin-bottom:11px}
    #reportDeleteModal h3{margin:0;color:#0F172A;font-size:16px;font-weight:950}.delete-dialog p{margin:6px 0 14px;color:#64748B;font-size:9px;line-height:1.5}.delete-dialog label{display:block;margin-bottom:6px;color:#334155;font-size:9px;font-weight:900}.delete-dialog input{width:100%;height:42px;border:1px solid #CBD5E1;border-radius:12px;padding:0 12px;outline:none;font-size:12px;font-weight:900;letter-spacing:4px;box-shadow:inset 2px 2px 5px rgba(15,23,42,.04)}.delete-dialog input:focus{border-color:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.08)}.delete-error{min-height:16px;color:#EF4444;font-size:8px;font-weight:900;margin-top:5px}.delete-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.delete-actions button{border:0;border-radius:11px;padding:9px 13px;font-size:9px;font-weight:950;cursor:pointer;box-shadow:4px 5px 10px rgba(15,23,42,.09);transition:.18s}.delete-cancel{background:#F1F5F9;color:#475569}.delete-confirm{background:linear-gradient(145deg,#FB7185,#EF4444);color:#fff}.delete-actions button:hover{transform:translateY(-2px)}
    @keyframes reportSearchPulse{0%,100%{box-shadow:7px 8px 14px rgba(37,99,235,.22),0 0 0 0 rgba(37,99,235,.14)}50%{box-shadow:7px 8px 14px rgba(37,99,235,.22),0 0 0 6px rgba(37,99,235,0)}}
    @keyframes reportButtonShine{0%,55%{left:-90%}80%,100%{left:140%}}
    @keyframes deleteModalIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    @media(max-width:1050px){#upload-invoice-report .report-filter-bar{grid-template-columns:1fr 1fr 1fr}.report-filter-count{grid-column:1/-1}.report-search-btn,.report-reset-btn{grid-column:auto}}
    @media(max-width:760px){#upload-invoice-report .report-filter-bar{grid-template-columns:1fr 1fr;padding:11px}.report-filter-count{grid-column:1/-1}.report-search-btn,.report-reset-btn{width:100%}.report-table-head{padding:12px}.report-table-head h3{font-size:13px}}
    @media(max-width:500px){#upload-invoice-report .report-filter-bar{grid-template-columns:1fr}.report-filter-count,.report-search-btn,.report-reset-btn{grid-column:1}.report-action{width:30px!important;height:30px!important}}
  </style>

  <script src="app.js"></script>
  <script>
    function closeProfileMenu(){document.querySelector('.profile-menu-wrap')?.classList.remove('open')}
    function showReportSubpage(id,button){document.querySelectorAll('.report-subpage').forEach(x=>x.classList.remove('active'));const target=document.getElementById(id);if(target)target.classList.add('active');document.querySelectorAll('.report-tab').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active');}
    function showSettingsPanel(id,button){document.querySelectorAll('.settings-panel').forEach(x=>x.classList.remove('active'));const target=document.getElementById(id+'-panel');if(target)target.classList.add('active');document.querySelectorAll('.settings-shortcut').forEach(x=>x.classList.remove('active'));if(button)button.classList.add('active');}
    document.addEventListener('DOMContentLoaded',()=>{
      const wrap=document.querySelector('.profile-menu-wrap');const trigger=document.querySelector('.profile-trigger');if(trigger&&wrap){trigger.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});document.addEventListener('click',()=>wrap.classList.remove('open'));wrap.querySelector('.profile-menu')?.addEventListener('click',e=>e.stopPropagation())}
      const rows=[{fy:'2026-27',month:'April',inv:'ERS/26-27/0012',party:'ABC Traders',gstin:'09ABCDE1234F1Z5',type:'Buy',amount:'₹ 48,500'},{fy:'2026-27',month:'April',inv:'ERS/26-27/0013',party:'XYZ Enterprises',gstin:'09XYZDE5678K1Z2',type:'Sell',amount:'₹ 72,800'},{fy:'2026-27',month:'May',inv:'ERS/26-27/0021',party:'Shree Suppliers',gstin:'09SHREE1234P1Z8',type:'Buy',amount:'₹ 35,600'},{fy:'2026-27',month:'May',inv:'ERS/26-27/0028',party:'Maa Enterprises',gstin:'09MAAEN9876Q1Z4',type:'Sell',amount:'₹ 91,250'},{fy:'2026-27',month:'June',inv:'ERS/26-27/0037',party:'Om Distributors',gstin:'09OMDIS3456R1Z7',type:'Buy',amount:'₹ 64,900'},{fy:'2026-27',month:'June',inv:'ERS/26-27/0042',party:'Shivam Telecom',gstin:'09SHIVA4567S1Z6',type:'Sell',amount:'₹ 1,12,400'},{fy:'2025-26',month:'March',inv:'ERS/25-26/0198',party:'R K Communications',gstin:'09RKCOM7654T1Z3',type:'Buy',amount:'₹ 27,350'}];
      const body=document.getElementById('reportTableBody'),fin=document.getElementById('reportFinYear'),month=document.getElementById('reportMonth'),type=document.getElementById('reportType'),party=document.getElementById('reportParty'),search=document.getElementById('reportSearchBtn'),reset=document.getElementById('reportResetBtn'),count=document.getElementById('reportRowCount'),filterCount=document.getElementById('reportFilterCount');let filteredRows=rows.slice(),pendingDelete=null;
      function renderReport(data){filteredRows=data;body.innerHTML=data.length?data.map((r,i)=>`<tr><td class="sl-cell">${i+1}</td><td>${r.fy}</td><td>${r.month}</td><td><strong>${r.inv}</strong></td><td class="party-cell"><strong>${r.party}</strong><small>${r.gstin}</small></td><td><span class="type-pill ${r.type==='Buy'?'type-buy':'type-sell'}">${r.type==='Buy'?'↙ BUY':'↗ SELL'}</span></td><td class="amount-cell">${r.amount}</td><td><div class="action-group"><button class="report-action action-view" title="View" type="button" data-action="view" data-index="${i}">◉</button><button class="report-action action-download" title="Download" type="button" data-action="download" data-index="${i}">↓</button><button class="report-action action-edit" title="Edit" type="button" data-action="edit" data-index="${i}">✎</button><button class="report-action action-delete" title="Delete" type="button" data-action="delete" data-index="${i}">⌫</button></div></td></tr>`).join(''):'<tr><td colspan="8"><div class="report-empty">कोई invoice record नहीं मिला। Filter बदलकर फिर Search करें।</div></td></tr>';count.textContent=data.length+' record'+(data.length===1?'':'s');filterCount.textContent=`Showing ${data.length} of ${rows.length} invoice records`}
      function applyFilters(){const f=fin.value,m=month.value,t=type.value,q=party.value.trim().toLowerCase();renderReport(rows.filter(r=>(f==='all'||r.fy===f)&&(m==='all'||r.month===m)&&(t==='all'||r.type===t)&&(!q||r.party.toLowerCase().includes(q))))}
      search?.addEventListener('click',()=>{search.classList.remove('report-search-bump');void search.offsetWidth;search.classList.add('report-search-bump');applyFilters()});reset?.addEventListener('click',()=>{fin.value='all';month.value='all';type.value='all';party.value='';applyFilters()});party?.addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters()});
      body?.addEventListener('click',e=>{const btn=e.target.closest('.report-action');if(!btn)return;const row=filteredRows[Number(btn.dataset.index)];if(!row)return;const action=btn.dataset.action;if(action==='view'){alert(`Invoice: ${row.inv}\nParty: ${row.party}\nType: ${row.type}\nAmount: ${row.amount}`)}else if(action==='download'){alert('Download action तैयार है — backend file link से connect किया जा सकता है।')}else if(action==='edit'){alert('Edit action तैयार है — invoice edit form से connect किया जा सकता है।')}else{pendingDelete=row;document.getElementById('deleteInvoiceText').textContent=`${row.inv} • ${row.party} को delete करने के लिए Security PIN enter करें।`;document.getElementById('deleteInvoicePin').value='';document.getElementById('deletePinError').textContent='';document.getElementById('reportDeleteModal').classList.add('open');document.getElementById('reportDeleteModal').setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('deleteInvoicePin').focus(),80)}});
      function closeDelete(){pendingDelete=null;document.getElementById('reportDeleteModal').classList.remove('open');document.getElementById('reportDeleteModal').setAttribute('aria-hidden','true')}
      document.getElementById('deleteCancelBtn')?.addEventListener('click',closeDelete);document.getElementById('reportDeleteModal')?.addEventListener('click',e=>{if(e.target.id==='reportDeleteModal')closeDelete()});document.getElementById('deleteConfirmBtn')?.addEventListener('click',()=>{const pin=document.getElementById('deleteInvoicePin').value.trim();if(!/^\d{4,8}$/.test(pin)){document.getElementById('deletePinError').textContent='कृपया 4 से 8 digit Security PIN enter करें।';return}document.getElementById('deletePinError').textContent='';closeDelete();alert('PIN accepted. Actual invoice deletion को backend security PIN से connect करना बाकी है।')});document.getElementById('deleteInvoicePin')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('deleteConfirmBtn').click();if(e.key==='Escape')closeDelete()});renderReport(rows);
    });
  </script>
</body>
</html>
