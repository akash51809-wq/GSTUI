name: Fix Report CSS Modularization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Upload Invoice CSS out of index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          css_file = Path('pages/report/upload-invoice.css')
          html_files = {
              'pending-invoice': Path('pages/report/pending-invoice.html'),
              'upload-invoice-report': Path('pages/report/upload-invoice-report.html'),
              'ai-report': Path('pages/report/ai-report.html'),
          }

          s = index.read_text(encoding='utf-8')
          start = s.find('    #upload-invoice-report.report-subpage{')
          end_marker = '    @media(max-width:500px){#upload-invoice-report .report-filter-bar{grid-template-columns:1fr}.report-filter-count,.report-search-btn,.report-reset-btn{grid-column:1}.report-action{width:30px!important;height:30px!important}}'
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Upload Invoice CSS block not found in index.html')
          end += len(end_marker)

          moved = s[start:end].strip() + '\n'
          existing = css_file.read_text(encoding='utf-8') if css_file.exists() else ''
          base = '/* Report > Upload Invoice page-only styles.\n * Keep future changes here instead of adding more rules to index.html.\n */\n'
          css_file.write_text(base + moved + '\n', encoding='utf-8')
          s = s[:start] + s[end:]
          index.write_text(s, encoding='utf-8')

          wrappers = {
              'pending-invoice': ('active',),
              'upload-invoice-report': (),
              'ai-report': (),
          }
          for key, path in html_files.items():
              body = path.read_text(encoding='utf-8').strip()
              if f'id="{key}"' not in body:
                  active = ' active' if key == 'pending-invoice' else ''
                  body = f'<div id="{key}" class="report-subpage{active}">\n{body}\n</div>\n'
                  path.write_text(body, encoding='utf-8')
          PY

      - name: Validate modular report files
        run: |
          test -s pages/report/upload-invoice.css
          grep -q 'report-filter-bar' pages/report/upload-invoice.css
          ! grep -q '#upload-invoice-report .report-filter-bar' index.html
          grep -q 'id="pending-invoice" class="report-subpage active"' pages/report/pending-invoice.html
          grep -q 'id="upload-invoice-report" class="report-subpage"' pages/report/upload-invoice-report.html
          grep -q 'id="ai-report" class="report-subpage"' pages/report/ai-report.html
          grep -q 'pages/module-loader.js' index.html

      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-report-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/report/upload-invoice.css pages/report/pending-invoice.html pages/report/upload-invoice-report.html pages/report/ai-report.html .github/workflows/fix-report-css.yml
          git commit -m "Modularize report CSS and subpages"
          git push