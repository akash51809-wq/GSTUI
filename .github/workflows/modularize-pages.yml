name: Modularize GSTUI Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract page modules
        run: node tools/modularize-pages.js

      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/
          if git diff --cached --quiet; then
            echo "No modularization changes needed."
          else
            git commit -m "Complete GSTUI page modularization"
            git push
          fi

      # Fresh-run trigger after fixing the page extraction script.
