name: Repair GSTUI Modularization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore original UI baseline
        run: git checkout 9aa18b0a3349ac94e9e9e5b1c5c7f081d51a9a99 -- index.html

      - name: Run modular extraction
        run: node tools/modularize-pages.js

      - name: Validate generated modules
        run: |
          test -s pages/dashboard/dashboard.html
          test -s pages/upload/upload.html
          test -s pages/report/report.html
          test -s pages/parties/parties.html
          test -s pages/settings/settings.html
          test -s pages/report/pending-invoice.html
          test -s pages/report/upload-invoice-report.html
          test -s pages/report/ai-report.html
          grep -q 'data-page-module="dashboard"' index.html
          grep -q 'data-page-module="upload"' index.html
          grep -q 'data-page-module="reports"' index.html
          grep -q 'data-page-module="parties"' index.html
          grep -q 'data-page-module="settings"' index.html
          grep -q 'pages/module-loader.js' index.html

      - name: Commit repaired modularization and disable one-time repair
        run: |
          rm -f .github/workflows/repair-modularization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/ .github/workflows/repair-modularization.yml
          if git diff --cached --quiet; then
            echo "No repair changes needed."
          else
            git commit -m "Repair GSTUI page modularization"
            git push
          fi
